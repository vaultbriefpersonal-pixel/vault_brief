name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          AUTH_SECRET: placeholder-ci-secret-32chars-minimum
          RESEND_API_KEY: re_placeholder
          AUTH_GOOGLE_ID: placeholder
          AUTH_GOOGLE_SECRET: placeholder
          OPENROUTER_API_KEY: sk-or-placeholder
          ALCHEMY_API_KEY: placeholder
          DUNE_API_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_PRICE_STARTER: price_placeholder
          STRIPE_PRICE_GROWTH: price_placeholder
          STRIPE_PRICE_VC_SUITE: price_placeholder
          TRIGGER_SECRET_KEY: tr_dev_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests (public pages only)
        run: npx playwright test --reporter=list
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@placeholder/placeholder
          AUTH_SECRET: placeholder-ci-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
