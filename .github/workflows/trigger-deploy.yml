name: Deploy Trigger.dev jobs

# Runs on a clean Linux runner — sidesteps the corporate TLS / antivirus
# MITM that prevents `trigger.dev deploy` from succeeding on the maintainer's
# Windows box (UNABLE_TO_VERIFY_LEAF_SIGNATURE on api.trigger.dev, and the
# same x509 error against Depot's remote builder).
#
# Path filter keeps this off the critical path of unrelated PRs: we only
# redeploy Trigger when the actual job code or its config changes.
on:
  push:
    branches: [main]
    paths:
      - "src/server/jobs/**"
      - "trigger.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

# Serialize Trigger.dev deploys. A push that touches trigger code can race
# with a manual `gh workflow run`, and Trigger.dev's indexer 500s on
# concurrent deploys of the same project ("Error creating background
# worker files"). cancel-in-progress=false queues the second run instead
# of throwing away work — every code-changing run still gets applied,
# just one at a time.
concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve Trigger.dev SDK version
        id: trigger-version
        # CLI version must exactly match @trigger.dev/sdk in package.json,
        # otherwise the deploy aborts with "Version mismatch detected while
        # running in CI." Read the pinned SDK version straight from
        # package.json so the workflow auto-tracks SDK bumps without
        # needing manual edits here.
        run: |
          SDK_VERSION=$(node -p "require('./package.json').dependencies['@trigger.dev/sdk']")
          echo "Resolved SDK version: $SDK_VERSION"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Deploy to Trigger.dev (production)
        run: npx trigger.dev@${{ steps.trigger-version.outputs.version }} deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
